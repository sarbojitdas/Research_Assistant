[project]
name = "research-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sarbojitdas-weaver", email = "sarbojit.das@weavers-web.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "email-validator>=2.2.0",
    "fastapi>=0.163.1",
    "httpx>=0.28.1",
    "langchain-core>=1.8.1",
    "langgraph>=1.2.22",
    "litellm>=1.109.1",
    "mcp[cli]>=2.3.0",
    "psycopg>=3.3.9",
    "psycopg-binary>=3.3.9",
    "pwdlib[argon2]>=0.4.2",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.15.1",
    "pypdf>=7.1.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.34",
    "sendgrid>=6.12.5",
    "sqlalchemy[asyncio]>=2.1.9",
    "tavily-python>=0.8.5",
    "uvicorn>=0.54.0",
]

[project.scripts]
research-assistant = "research_assistant:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
